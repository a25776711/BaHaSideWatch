<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BaHaSideWatch 設定</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1c1c1e;
      --muted: #6b6b70;
      --track: #c7c7cc;
      --accent: #00a3c4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1f22;
        --fg: #f2f2f4;
        --muted: #a0a0a8;
        --track: #55565c;
        --accent: #22c1e3;
      }
    }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body {
      width: 300px;
      padding: 14px 16px 16px;
      box-sizing: border-box;
      font: 14px/1.5 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    }
    h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
    .switch { position: relative; flex: none; width: 40px; height: 22px; }
    .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .switch span {
      position: absolute; inset: 0; border-radius: 11px;
      background: var(--track); transition: background 0.15s; pointer-events: none;
    }
    .switch span::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; transition: transform 0.15s;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    p.hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>BaHaSideWatch</h1>
  <label class="row">
    <span>原生全螢幕改為側欄模式</span>
    <span class="switch"><input type="checkbox" id="takeoverNative"><span></span></span>
  </label>
  <p class="hint">開啟後，按 F、全螢幕鈕或雙擊影片會進入側欄全螢幕；關閉則維持動畫瘋原本的全螢幕。Shift+F 與控制列按鈕不受影響。</p>
  <script src="popup.js"></script>
</body>
</html>
